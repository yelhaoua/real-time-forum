<div class="container register-shell">
  <main class="card register-card">
    <section class="brand register-brand">
      <div class="logo">
        <span class="wordmark">Zone01<span>Forum</span></span>
      </div>

      <div class="brand-body">
        <div class="eyebrow">Welcome To Your Forum</div>
        <h1>Where your network gets to work.</h1>
      </div>
    </section>

    <section class="form-wrap register-form-wrap">
      <div class="form-inner">
        <h2 class="title">Create your account</h2>
        <p class="subtitle">
          Already have an account?
          <a href="#/login" class="nav-link">Sign in</a>
        </p>

        <form id="RegisterForm" method="post">
          <div>
            <label class="field-label" for="nickname">Nickname</label>
            <div class="field">
              <span class="ic"><i class="fa-regular fa-user"></i></span>
              <input
                id="Nickname"
                name="nickname"
                type="text"
                placeholder="kaito"
                required
              />
            </div>
            <span class="error" id="nickname-Err"></span>
          </div>

          <div class="fullname_holder">
            <div>
              <label class="field-label" for="first-name">First Name</label>
              <div class="field">
                <span class="ic"><i class="fa-regular fa-user"></i></span>
                <input
                  id="first-name"
                  name="first-name"
                  type="text"
                  placeholder="Joe Deo"
                  required
                />
              </div>
              <span class="error" id="first-name-Err"></span>
            </div>

            <div>
              <label class="field-label" for="last-name">Last Name</label>
              <div class="field">
                <span class="ic"><i class="fa-regular fa-user"></i></span>
                <input
                  id="last-name"
                  name="last-name"
                  type="text"
                  placeholder="Joe Deo"
                  required
                />
              </div>
              <span class="error" id="last-name-Err"></span>
            </div>
          </div>

          <div>
            <label class="field-label" for="user-birthdate"
              >Date of birth</label
            >
            <div class="field">
              <span class="ic"><i class="fa-regular fa-calendar"></i></span>
              <input
                id="user-birthdate"
                name="user-birthdate"
                type="date"
                required
              />
            </div>
            <span class="error" id="user-birthdate-Err"></span>
          </div>

          <div>
            <label class="field-label" for="user-gender">Your Gender</label>
            <div class="field select-field">
              <span class="ic"><i class="fa-regular fa-user"></i></span>
              <select id="user-gender" name="user-gender" required>
                <option value="" disabled selected>Select your gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
              </select>
            </div>
            <span class="error" id="gender-Err"></span>
          </div>

          <div>
            <label class="field-label" for="email">Email</label>
            <div class="field">
              <span class="ic"><i class="fa-regular fa-envelope"></i> </span>
              <input
                id="email"
                name="email"
                type="email"
                placeholder="you@company.com"
                autocomplete="email"
                required
              />
            </div>
            <span class="error" id="email-Err"></span>
          </div>

          <div>
            <label class="field-label" for="password">Password</label>
            <div class="field">
              <span class="ic"> <i class="fa-solid fa-lock"></i></span>
              <input
                id="password"
                name="password"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />
            </div>
            <span class="error" id="pass-Err"></span>
          </div>

          <button class="btn" type="submit">Create account</button>
        </form>
        <div class="foot">
          <div class="copy">Created At Zone01 Oujda © 2021</div>
        </div>
      </div>
    </section>
  </main>
</div>
