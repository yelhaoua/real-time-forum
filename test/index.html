<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-body: #f4f6f8;
        --bg-card: #ffffff;
        --text-main: #1e293b;
        --text-muted: #64748b;
        --primary: #3b82f6;
        --border-color: #e2e8f0;
        --accent-red: #ef4444;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }

      body {
        background-color: var(--bg-body);
        color: var(--text-main);
        padding: 20px;
        display: flex;
        justify-content: center;
      }

      .main-content {
        display: grid;
        grid-template-columns: 260px 1fr 280px;
        gap: 25px;
        padding: 25px 30px;
        background: #f8fafc;
      }


      .profile-card {
        text-align: center;
        position: relative;
      }

      .settings-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        color: var(--text-muted);
        cursor: pointer;
      }

      .avatar-large {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 10px;
      }

      .profile-card h3 {
        font-size: 16px;
        font-weight: 600;
      }

      .profile-card p {
        font-size: 12px;
        color: var(--text-muted);
        margin-bottom: 15px;
      }

      .item-list {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .list-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        text-decoration: none;
        color: var(--text-main);
      }

      .item-info {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .item-icon {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }

      .icon-twitter {
        background: #e0f2fe;
        color: #0ea5e9;
      }
      .icon-github {
        background: #f1f5f9;
        color: #0f172a;
      }
      .icon-apple {
        background: #f1f5f9;
        color: #000000;
      }

      .item-text h4 {
        font-size: 13px;
        font-weight: 600;
      }

      .item-text p {
        font-size: 11px;
        color: var(--text-muted);
      }

      .item-badge {
        background: #fee2e2;
        color: var(--accent-red);
        font-size: 11px;
        font-weight: 600;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .footer-links {
        font-size: 11px;
        color: var(--text-muted);
        line-height: 1.8;
        padding-left: 10px;
      }
      .footer-links a {
        color: var(--text-muted);
        text-decoration: none;
        margin-right: 5px;
      }

      .create-post {
        padding: 15px 20px;
      }

      .post-input-wrapper {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 15px;
      }

      .post-input-wrapper img {
        width: 35px;
        height: 35px;
        border-radius: 50%;
      }

      .post-input-wrapper input {
        flex: 1;
        padding: 10px 15px;
        border-radius: 20px;
        border: 1px solid var(--border-color);
        background: #f8fafc;
        outline: none;
        font-size: 13px;
      }

      .post-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid var(--border-color);
        padding-top: 12px;
      }

      .action-buttons {
        display: flex;
        gap: 15px;
      }

      .action-btn {
        background: none;
        border: none;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--text-muted);
        cursor: pointer;
        font-weight: 500;
      }

      .action-btn i {
        font-size: 14px;
      }
      .btn-img i {
        color: #3b82f6;
      }
      .btn-vid i {
        color: #10b981;
      }
      .btn-att i {
        color: #f59e0b;
      }
      .btn-hash i {
        color: #ef4444;
      }

      .post-privacy {
        font-size: 12px;
        color: var(--text-muted);
        cursor: pointer;
      }

      .feed-sort {
        text-align: right;
        font-size: 12px;
        color: var(--text-muted);
        margin-bottom: 15px;
      }
      .feed-sort span {
        color: var(--text-main);
        font-weight: 600;
      }


      .profile-menu-card {
        padding: 20px 0;
      }

      .menu-section-title {
        font-size: 14px;
        font-weight: 600;
        padding: 0 20px 15px 20px;
        border-bottom: 1px solid var(--border-color);
      }

      .menu-list {
        list-style: none;
        padding: 10px 0;
      }

      .menu-list li a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 20px;
        text-decoration: none;
        color: var(--text-main);
        font-size: 13px;
        font-weight: 500;
      }

      .menu-list li a:hover {
        background: #f8fafc;
      }

      .menu-list li a i {
        color: var(--text-muted);
        font-size: 16px;
      }

      .right-sidebar .card-title {
        padding: 0 20px;
        margin-top: 15px;
      }

      .right-sidebar .item-list {
        padding: 0 20px;
      }

      .sign-out-btn {
        display: block;
        margin: 20px 20px 0 20px;
        padding-top: 15px;
        border-top: 1px solid var(--border-color);
        text-decoration: none;
        color: var(--text-muted);
        font-size: 13px;
        font-weight: 500;
      }
    </style>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    

    <input type="text" minlength="" maxlength="" value="">
  </body>
</html>
